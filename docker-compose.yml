# Local development / testing: builds the image from source and publishes the
# UI on http://localhost:8080.
services:
  app:
    build: .
    image: copypasta:dev
    environment:
      REDIS_ADDR: redis:6379
      PORT: "8080"
      MAX_PASTE_BYTES: "5242880"   # 5 MiB
      DEFAULT_TTL_SECONDS: "600"
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/copypasta", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # No RDB snapshots, no AOF: pastes exist in memory only and expiry is final.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-ttl"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
