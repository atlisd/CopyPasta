name: release

# Pushing a version tag (v0.9.0, v0.9.1, v1.0.0, …) publishes the image to GHCR.
# Redeploy on the server with:
#   docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # to create the GitHub Release
  packages: write   # to push the image to GHCR

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Test before publishing
        run: go test ./...

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/copypasta
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write release notes
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/copypasta
          VERSION: ${{ github.ref_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cat > notes.md <<EOF
          ### Image

          \`\`\`
          $IMAGE:$VERSION
          \`\`\`

          Digest: \`$DIGEST\` — linux/amd64, linux/arm64.

          ### Deploy

          \`\`\`sh
          # in .env on the Docker host
          IMAGE_TAG=$VERSION

          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
          \`\`\`
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
